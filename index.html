<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PENDEJADAS</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Configuración de Tailwind (debe cargarse justo después del CDN) -->
  <script src="js/tailwind-config.js"></script>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Estilos propios -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-full flex flex-col font-sans antialiased selection:bg-pink-500 selection:text-white bg-slate-950 text-slate-100">

  <!-- Ambient Light Effects -->
  <div class="fixed top-[-10%] left-1/2 -translate-x-1/2 w-[600px] h-[350px] bg-gradient-to-tr from-pink-600/20 via-purple-600/20 to-cyan-500/10 rounded-full blur-[130px] pointer-events-none"></div>

  <!-- Header Section -->
  <header class="relative z-10 pt-10 pb-6 text-center px-4">
    <div class="max-w-4xl mx-auto">

      <!-- Título Gigante "PENDEJADAS" -->
      <h1 class="font-title text-6xl sm:text-8xl md:text-9xl font-black tracking-tight title-gradient uppercase animate-glow-pulse select-none">
        PENDEJADAS
      </h1>
      <p class="text-slate-400 text-sm sm:text-base mt-3 font-medium tracking-wide">
        Lleva la cuenta de las ocurrencias del Acevedo en tiempo real
      </p>

      <!-- Panel Superior: Formulario Agregar Persona y Contadores Globales -->
      <div class="mt-8 flex flex-col sm:flex-row items-center justify-between gap-4 bg-slate-900/80 backdrop-blur-xl p-4 sm:p-5 rounded-3xl border border-slate-800/80 shadow-2xl">
        <form id="addPersonForm" class="flex items-center gap-2 w-full sm:w-auto flex-1 max-w-md">
          <div class="relative w-full">
            <i class="fa-solid fa-user-plus absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
            <input
              type="text"
              id="personNameInput"
              placeholder="Nombre de la persona..."
              required
              autocomplete="off"
              class="w-full pl-11 pr-4 py-3 bg-slate-950/80 border border-slate-800 rounded-2xl focus:outline-none focus:border-pink-500 focus:ring-2 focus:ring-pink-500/20 text-slate-100 placeholder-slate-500 transition-all text-sm sm:text-base"
            >
          </div>
          <button
            type="submit"
            class="px-5 py-3 bg-gradient-to-r from-pink-500 via-rose-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white font-semibold rounded-2xl shadow-lg shadow-pink-500/25 active:scale-95 transition-all flex items-center gap-2 whitespace-nowrap text-sm sm:text-base cursor-pointer"
          >
            <i class="fa-solid fa-plus text-xs"></i>
            <span>Agregar</span>
          </button>
        </form>

        <!-- Contadores Globales -->
        <div class="flex items-center gap-6 text-xs sm:text-sm font-semibold text-slate-300 w-full sm:w-auto justify-around border-t sm:border-t-0 border-slate-800/80 pt-3 sm:pt-0">
          <div class="text-center">
            <span class="block text-slate-500 uppercase text-[10px] tracking-wider font-bold">Personas</span>
            <span id="totalPersons" class="text-2xl font-black text-pink-400">0</span>
          </div>
          <div class="h-8 w-px bg-slate-800"></div>
          <div class="text-center">
            <span class="block text-slate-500 uppercase text-[10px] tracking-wider font-bold">Total Frases</span>
            <span id="totalCount" class="text-2xl font-black text-purple-400">0</span>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Content Grid Section -->
  <main class="relative z-10 flex-1 max-w-7xl w-full mx-auto px-4 py-6">

    <!-- Estado Vacío Inicial -->
    <div id="emptyState" class="flex flex-col items-center justify-center py-20 text-center">
      <div class="w-20 h-20 bg-slate-900/90 rounded-3xl flex items-center justify-center text-3xl text-pink-500 border border-slate-800 shadow-xl mb-4">
        <i class="fa-solid fa-face-laugh-beam"></i>
      </div>
      <h2 class="text-xl font-bold text-slate-200">¡Todo listo para empezar!</h2>
      <p class="text-slate-400 text-sm mt-1 max-w-xs">Agrega a la primera persona con el formulario de arriba para comenzar a registrar sus pendejadas.</p>
    </div>

    <!-- Grid de Personas -->
    <div id="peopleGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Generado dinámicamente por js/app.js -->
    </div>
  </main>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Lógica de la aplicación -->
  <script src="js/app.js"></script>
</body>
</html>
